<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAGAM — Automated Agricultural Grain & Allocation Management</title>
    <meta name="theme-color" content="#166534" />
    <meta name="description" content="AAGAM - Automated Agricultural Grain & Allocation Management platform" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/images/aagam_logo.png" />
    <link rel="apple-touch-icon" href="/images/aagam_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && !window.location.host.includes('localhost:5173')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[AAGAM PWA] Service Worker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('[AAGAM PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
